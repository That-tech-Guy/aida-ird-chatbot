<html>

	<link rel="stylesheet" type="text/css" href="admin_styles.css">
	<title> AIDA ADMIN PANEL </title>
</head>
<body>
	<div class="admin-panel">
		<h3> Update Chatbot Knowledge </h3>

			<input type="text" name="intent" placeholder="INTENT" class="input-box" required> <br> <br>

			<input type="text" name="language" placeholder="LANGUAGE" class="input-box" required> <br> <br>
			<input type="text" name="question" placeholder="QUESTION" class="input-box" required> <br> <br>
