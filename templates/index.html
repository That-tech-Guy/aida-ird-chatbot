<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A.I.D.A. — Anguilla Inland Revenue Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!--
        The official IRD homepage remains behind the demonstration widget.
        In production, the widget would be inserted directly into that site.
    -->
    <main class="website-preview">
        <iframe
            class="ird-website-frame"
            src="https://ird.gov.ai/"
            title="Anguilla Inland Revenue Department website"
            loading="eager"
        ></iframe>
    </main>

    <!-- Circular launcher shown while the chatbot is closed -->
    <button
        class="chat-launcher"
        id="chat-launcher"
        type="button"
        aria-label="Open A.I.D.A. chatbot"
        aria-controls="chat-widget"
        aria-expanded="false"
    >
        <span class="launcher-glow" aria-hidden="true"></span>

        <img
            src="{{ url_for('static', filename='images/aida_logo.jpeg') }}"
            alt="A.I.D.A."
        >

        <span class="launcher-status" aria-hidden="true"></span>

        <!--
            Unread A.I.D.A. responses appear here whenever the widget
            is minimised or the browser tab is not being viewed.
        -->
        <span
            class="notification-badge"
            id="notification-badge"
            aria-live="polite"
            aria-label="No unread A.I.D.A. messages"
            hidden
        >
            0
        </span>
    </button>

    <!-- Main floating chatbot -->
    <aside
        class="chat-widget"
        id="chat-widget"
        aria-label="A.I.D.A. chatbot"
        aria-hidden="true"
    >
        <header class="chat-header">

            <!-- Anguilla-inspired decorative line art -->
            <svg
                class="header-art"
                viewBox="0 0 520 170"
                aria-hidden="true"
            >
                <defs>
                    <linearGradient
                        id="islandFill"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >
                        <stop
                            offset="0%"
                            stop-color="#59ef8f"
                            stop-opacity="0.22"
                        />
                        <stop
                            offset="100%"
                            stop-color="#ff8a00"
                            stop-opacity="0.05"
                        />
                    </linearGradient>

                    <radialGradient
                        id="headerGlow"
                        cx="50%"
                        cy="50%"
                        r="50%"
                    >
                        <stop
                            offset="0%"
                            stop-color="#ffb42b"
                            stop-opacity="0.72"
                        />
                        <stop
                            offset="100%"
                            stop-color="#ff7900"
                            stop-opacity="0"
                        />
                    </radialGradient>
                </defs>

                <circle
                    cx="465"
                    cy="90"
                    r="95"
                    fill="url(#headerGlow)"
                />

                <!-- Document icon -->
                <g class="header-line-icon document-icon">
                    <path d="M315 23h34l17 17v43h-51z" />
                    <path d="M349 23v18h17" />
                    <path d="M326 53h25M326 64h20" />
                </g>

                <!-- Simplified Anguilla island silhouette -->
                <path
                    class="anguilla-island"
                    d="
                        M250 111
                        C275 98 296 96 320 88
                        C347 79 370 65 397 62
                        C421 59 444 65 468 58
                        C481 54 494 47 507 40
                        C498 52 487 64 474 74
                        C454 89 435 101 412 107
                        C388 113 367 109 343 113
                        C318 117 294 126 269 128
                        C259 127 253 121 250 111
                        Z
                    "
                />

                <path
                    class="topographic-line line-one"
                    d="M390 20C429 43 467 62 519 66"
                />
                <path
                    class="topographic-line line-two"
                    d="M375 9C428 30 478 43 521 44"
                />
                <path
                    class="topographic-line line-three"
                    d="M408 39C450 61 484 80 520 91"
                />

                <!-- Bank / public-service icon -->
                <g class="header-line-icon bank-icon">
                    <path d="m420 135 31-22 31 22" />
                    <path d="M426 136h50M431 136v24M445 136v24M460 136v24M474 136v24M423 161h56" />
                    <rect x="448" y="126" width="7" height="10" rx="1" />
                </g>

                <!-- Revenue icon -->
                <g class="header-line-icon money-icon">
                    <circle cx="490" cy="91" r="24" />
                    <path d="M490 75v32M499 81c-3-4-17-5-17 3 0 10 17 4 17 14 0 8-14 8-19 3" />
                </g>
            </svg>

            <!--
                Real header illustration assets.
                The original SVG artwork above is intentionally retained
                so the existing HTML is not removed; CSS hides that SVG
                and displays these supplied illustration assets instead.
            -->
            <div
                class="real-header-art"
                aria-hidden="true"
            >
                <img
                    class="real-header-image real-header-document"
                    src="{{ url_for('static', filename='images/header/document.png') }}"
                    alt=""
                >

                <img
                    class="real-header-image real-header-anguilla"
                    src="{{ url_for('static', filename='images/header/anguilla-map.png') }}"
                    alt=""
                >

                <img
                    class="real-header-image real-header-revenue"
                    src="{{ url_for('static', filename='images/header/revenue.png') }}"
                    alt=""
                >

                <img
                    class="real-header-image real-header-bank"
                    src="{{ url_for('static', filename='images/header/bank.png') }}"
                    alt=""
                >
            </div>

            <div class="chat-agent">
                <div class="header-avatar-wrap">
                    <span class="avatar-neon-ring" aria-hidden="true"></span>

                    <img
                        class="header-avatar"
                        src="{{ url_for('static', filename='images/aida_logo.jpeg') }}"
                        alt="A.I.D.A."
                    >

                    <span class="avatar-status" aria-hidden="true"></span>
                </div>

                <div class="agent-copy">
                    <h1>A.I.D.A.</h1>

                    <p>
                        Anguilla Inland Revenue Assistant
                    </p>

                    <div class="online-status">
                        <span aria-hidden="true"></span>
                        Online
                    </div>
                </div>
            </div>

            <div class="header-controls">

                <button
                    class="header-control"
                    id="chat-minimise-button"
                    type="button"
                    aria-label="Minimise chatbot"
                    title="Minimise"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 12h14" />
                    </svg>
                </button>

                <button
                    class="header-control"
                    id="chat-expand-button"
                    type="button"
                    aria-label="Make chatbot larger"
                    title="Expand chatbot"
                    aria-pressed="false"
                >
                    <svg
                        class="expand-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
                        <path d="m3 8 6-6M21 8l-6-6M3 16l6 6M21 16l-6 6" />
                    </svg>

                    <svg
                        class="contract-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M9 9H4V4M15 9h5V4M9 15H4v5M15 15h5v5" />
                        <path d="m4 4 6 6M20 4l-6 6M4 20l6-6M20 20l-6-6" />
                    </svg>
                </button>

                <button
                    class="header-control"
                    id="chat-close-button"
                    type="button"
                    aria-label="Close chatbot"
                    title="Close"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m5 5 14 14M19 5 5 19" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Conversation -->
        <section
            class="chat-body"
            id="chat-messages"
            aria-live="polite"
        ></section>

        <!--
            Help drawer appears at the bottom of the widget and contains
            Quick Actions and Popular Questions.
        -->
        <section
            class="help-drawer"
            id="help-drawer"
            aria-hidden="true"
        >
            <div class="drawer-section">
                <div class="drawer-heading">
                    <div>
                        <strong>Quick Actions</strong>
                        <span>Choose a service</span>
                    </div>

                    <button
                        class="drawer-close"
                        id="drawer-close"
                        type="button"
                        aria-label="Hide quick actions"
                    >
                        ×
                    </button>
                </div>

                <div
                    class="quick-actions-grid"
                    id="quick-actions-grid"
                ></div>
            </div>

            <div class="drawer-section popular-section">
                <div class="drawer-heading compact-heading">
                    <div>
                        <strong>Popular Questions</strong>
                        <span>Frequently requested help</span>
                    </div>
                </div>

                <div
                    class="popular-questions"
                    id="popular-questions"
                ></div>
            </div>
        </section>

        <!-- Bottom composer -->
        <footer class="chat-footer">
            <button
                class="help-button"
                id="help-button"
                type="button"
                aria-controls="help-drawer"
                aria-expanded="false"
                title="Show quick actions"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2 9.8 8.4 3 10l6.8 1.6L12 18l2.2-6.4L21 10l-6.8-1.6L12 2Z" />
                </svg>

                <span>Help</span>
            </button>

            <form class="chat-form" id="chat-form">
                <div class="message-input-shell">
                    <input
                        id="chat-input"
                        type="text"
                        placeholder="Type your question here..."
                        autocomplete="off"
                        aria-label="Message A.I.D.A."
                    >

                    <button
                        class="attachment-button microphone-button"
                        id="microphone-button"
                        type="button"
                        aria-label="Speak your question"
                        title="Speak your question"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="9" y="3" width="6" height="11" rx="3" />
                            <path d="M6 11a6 6 0 0 0 12 0" />
                            <path d="M12 17v4M9 21h6" />
                        </svg>
                    </button>
                </div>

                <button
                    class="send-button"
                    id="send-button"
                    type="submit"
                    aria-label="Send message"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m21 3-7.3 18-3.2-7.5L3 10.3 21 3Z" />
                        <path d="m10.5 13.5 5-5" />
                    </svg>
                </button>
            </form>
        </footer>
    </aside>

    <script
        src="{{ url_for('static', filename='js/chatbot.js') }}"
    ></script>

</body>
</html>
