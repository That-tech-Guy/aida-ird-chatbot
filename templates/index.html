<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A.I.D.A. — Anguilla Inland Revenue Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!--
        The official IRD homepage remains behind the demonstration widget.
        In production, the widget would be inserted directly into that site.
    -->
    <main class="website-preview">
        <iframe
            class="ird-website-frame"
            src="https://ird.gov.ai/"
            title="Anguilla Inland Revenue Department website"
            loading="eager"
        ></iframe>
    </main>

    <!-- Circular launcher shown while the chatbot is closed -->
    <button
        class="chat-launcher"
        id="chat-launcher"
        type="button"
        aria-label="Open A.I.D.A. chatbot"
        aria-controls="chat-widget"
        aria-expanded="false"
    >
        <span class="launcher-glow" aria-hidden="true"></span>

        <img
            src="{{ url_for('static', filename='images/aida_logo.jpeg') }}"
            alt="A.I.D.A."
        >

        <span class="launcher-status" aria-hidden="true"></span>
    </button>

    <!-- Main floating chatbot -->
    <aside
        class="chat-widget"
        id="chat-widget"
        aria-label="A.I.D.A. chatbot"
        aria-hidden="true"
    >
        <header class="chat-header">

            <!-- Real illustration assets based on the supplied Anguilla and IRD imagery -->
            <div
                class="header-art"
                aria-hidden="true"
            >
                <img
                    class="header-art-image header-document-art"
                    src="{{ url_for('static', filename='images/header/document.png') }}"
                    alt=""
                >

                <img
                    class="header-art-image header-anguilla-art"
                    src="{{ url_for('static', filename='images/header/anguilla-map.png') }}"
                    alt=""
                >

                <img
                    class="header-art-image header-bank-art"
                    src="{{ url_for('static', filename='images/header/bank.png') }}"
                    alt=""
                >

                <img
                    class="header-art-image header-revenue-art"
                    src="{{ url_for('static', filename='images/header/revenue.png') }}"
                    alt=""
                >
            </div>

            <div class="chat-agent">
                <div class="header-avatar-wrap">
                    <span class="avatar-neon-ring" aria-hidden="true"></span>

                    <img
                        class="header-avatar"
                        src="{{ url_for('static', filename='images/aida_logo.jpeg') }}"
                        alt="A.I.D.A."
                    >

                    <span class="avatar-status" aria-hidden="true"></span>
                </div>

                <div class="agent-copy">
                    <h1>A.I.D.A.</h1>

                    <p>
                        Anguilla Inland Revenue Assistant
                    </p>

                    <div class="online-status">
                        <span aria-hidden="true"></span>
                        Online
                    </div>
                </div>
            </div>

            <div class="header-controls">

                <button
                    class="header-control"
                    id="chat-minimise-button"
                    type="button"
                    aria-label="Minimise chatbot"
                    title="Minimise"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 12h14" />
                    </svg>
                </button>

                <button
                    class="header-control"
                    id="chat-expand-button"
                    type="button"
                    aria-label="Make chatbot larger"
                    title="Expand chatbot"
                    aria-pressed="false"
                >
                    <svg
                        class="expand-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
                        <path d="m3 8 6-6M21 8l-6-6M3 16l6 6M21 16l-6 6" />
                    </svg>

                    <svg
                        class="contract-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M9 9H4V4M15 9h5V4M9 15H4v5M15 15h5v5" />
                        <path d="m4 4 6 6M20 4l-6 6M4 20l6-6M20 20l-6-6" />
                    </svg>
                </button>

                <button
                    class="header-control"
                    id="chat-close-button"
                    type="button"
                    aria-label="Close chatbot"
                    title="Close"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m5 5 14 14M19 5 5 19" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Conversation -->
        <section
            class="chat-body"
            id="chat-messages"
            aria-live="polite"
        ></section>

        <!--
            Help drawer appears at the bottom of the widget and contains
            Quick Actions and Popular Questions.
        -->
        <section
            class="help-drawer"
            id="help-drawer"
            aria-hidden="true"
        >
            <div class="drawer-section">
                <div class="drawer-heading">
                    <div>
                        <strong>Quick Actions</strong>
                        <span>Choose a service</span>
                    </div>

                    <button
                        class="drawer-close"
                        id="drawer-close"
                        type="button"
                        aria-label="Hide quick actions"
                    >
                        ×
                    </button>
                </div>

                <div
                    class="quick-actions-grid"
                    id="quick-actions-grid"
                ></div>
            </div>

            <div class="drawer-section popular-section">
                <div class="drawer-heading compact-heading">
                    <div>
                        <strong>Popular Questions</strong>
                        <span>Frequently requested help</span>
                    </div>
                </div>

                <div
                    class="popular-questions"
                    id="popular-questions"
                ></div>
            </div>
        </section>

        <!-- Bottom composer -->
        <footer class="chat-footer">
            <button
                class="help-button"
                id="help-button"
                type="button"
                aria-controls="help-drawer"
                aria-expanded="false"
                title="Show quick actions"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2 9.8 8.4 3 10l6.8 1.6L12 18l2.2-6.4L21 10l-6.8-1.6L12 2Z" />
                </svg>

                <span>Help</span>
            </button>

            <form class="chat-form" id="chat-form">
                <div class="message-input-shell">
                    <input
                        id="chat-input"
                        type="text"
                        placeholder="Type your question here..."
                        autocomplete="off"
                        aria-label="Message A.I.D.A."
                    >

                    <button
                        class="attachment-button"
                        type="button"
                        aria-label="Attach a file"
                        title="Attachment preview only"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M8.5 12.5 14.9 6.1a3 3 0 0 1 4.2 4.2l-8.5 8.5a5 5 0 0 1-7.1-7.1l8-8"
                            />
                        </svg>
                    </button>
                </div>

                <button
                    class="send-button"
                    id="send-button"
                    type="submit"
                    aria-label="Send message"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m21 3-7.3 18-3.2-7.5L3 10.3 21 3Z" />
                        <path d="m10.5 13.5 5-5" />
                    </svg>
                </button>
            </form>
        </footer>
    </aside>

    <script
        src="{{ url_for('static', filename='js/chatbot.js') }}"
    ></script>

</body>
</html>
