<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inland Revenue Department Anguilla</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!--
        The official IRD homepage remains behind the demonstration
        widget so the client can see A.I.D.A. in a realistic setting.
    -->
    <main class="website-preview">
        <iframe
            class="ird-website-frame"
            src="https://ird.gov.ai/"
            title="Anguilla Inland Revenue Department website"
            loading="eager"
        ></iframe>
    </main>

    <!-- Floating launcher shown while the full chatbot is closed -->
    <button
        class="chat-launcher"
        id="chat-launcher"
        type="button"
        aria-label="Open A.I.D.A. chatbot"
        aria-controls="chat-widget"
        aria-expanded="false"
    >
        <img
            src="{{ url_for('static', filename='images/aida_logo.jpeg') }}"
            alt="A.I.D.A."
        >

        <span class="launcher-status" aria-hidden="true"></span>
    </button>

    <!--
        The widget structure follows the supplied design:
        branded green header, chat history, service buttons,
        typing indicator and a rounded message composer.
    -->
    <aside
        class="chat-widget"
        id="chat-widget"
        aria-label="A.I.D.A. chatbot"
        aria-hidden="true"
    >
        <header class="chat-header">

            <!-- Decorative palm-like line art -->
            <svg
                class="header-decoration"
                viewBox="0 0 180 120"
                aria-hidden="true"
            >
                <path d="M175 111C139 76 118 52 101 6" />
                <path d="M136 64C154 58 168 59 179 63" />
                <path d="M126 50C145 43 159 43 174 47" />
                <path d="M115 35C132 28 146 27 159 31" />
                <path d="M105 20C118 14 130 12 141 15" />
                <path d="M140 70C132 86 128 99 128 116" />
                <path d="M124 55C113 73 108 91 108 110" />
                <path d="M111 39C98 55 91 72 88 90" />
            </svg>

            <div class="chat-agent">
                <div class="header-avatar-wrap">
                    <img
                        class="header-avatar"
                        src="{{ url_for('static', filename='images/aida_logo.jpeg') }}"
                        alt="A.I.D.A."
                    >
                    <span class="avatar-status" aria-hidden="true"></span>
                </div>

                <div class="agent-copy">
                    <h1>A.I.D.A.</h1>
                    <p>Anguilla Inland Revenue Assistant</p>

                    <div class="online-status">
                        <span aria-hidden="true"></span>
                        Online
                    </div>
                </div>
            </div>

            <div class="header-controls">
                <button
                    class="header-control"
                    id="chat-minimise-button"
                    type="button"
                    aria-label="Minimise chatbot"
                >
                    <span aria-hidden="true">−</span>
                </button>

                <button
                    class="header-control"
                    id="chat-close-button"
                    type="button"
                    aria-label="Close chatbot"
                >
                    <span aria-hidden="true">×</span>
                </button>
            </div>
        </header>

        <section
            class="chat-body"
            id="chat-messages"
            aria-live="polite"
        >
            <!-- The initial conversation is inserted by chatbot.js -->
        </section>

        <footer class="chat-footer">
            <form class="chat-form" id="chat-form">
                <div class="message-input-shell">
                    <input
                        id="chat-input"
                        type="text"
                        placeholder="Type your question here..."
                        autocomplete="off"
                        aria-label="Message A.I.D.A."
                    >

                    <button
                        class="attachment-button"
                        type="button"
                        aria-label="Attach a file"
                        title="Attachment preview only"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M8.5 12.5 14.9 6.1a3 3 0 0 1 4.2 4.2l-8.5 8.5a5 5 0 0 1-7.1-7.1l8-8"
                            />
                        </svg>
                    </button>
                </div>

                <button
                    class="send-button"
                    type="submit"
                    aria-label="Send message"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m21 3-7.3 18-3.2-7.5L3 10.3 21 3Z" />
                        <path d="m10.5 13.5 5-5" />
                    </svg>
                </button>
            </form>
        </footer>
    </aside>

    <script
        src="{{ url_for('static', filename='js/chatbot.js') }}"
    ></script>

</body>
</html>
